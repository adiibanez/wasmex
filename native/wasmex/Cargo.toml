[package]
name = "wasmex"
version = "0.10.0"
authors = ["Philipp Tessenow <philipp@tessenow.org>"]
description = "Elixir extension to run WebAssembly binaries through wasmtime"
readme = "README.md"
repository = "https://github.com/tessi/wasmex"
keywords = ["elixir", "extension", "webassembly", "wasmtime"]
categories = ["wasm"]
edition = "2021"

[lib]
name = "wasmex"
path = "src/lib.rs"
# crate-type = ["dylib", "staticlib"]
crate-type = ["staticlib"]

[dependencies]
# rustler = { version = "0.36.1", features = ["big_integer", "serde"] }
# branch = "static"
rustler = { git = "https://github.com/filmor/rustler.git", rev ="cffa18a7fbad85de41a688839b31bce2253ed1d4", default-features = false, features = ["big_integer", "serde", "staticlib", "derive", "nif_version_2_15"]}
once_cell = "1.21.1"
rand = "0.9.0"
wasmtime = "30.0.2"
wasmtime-wasi = "30.0.2"
wasmtime-wasi-http = "30.0.2"
wasi-common = "30.0.2"
wiggle = "30.0.2"
wat = "1.227.1"
wit-parser = "0.227.1"
convert_case = "0.8.0"

[profile.release]
panic = "abort"